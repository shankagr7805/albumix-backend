version: '3.8'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: albumix

    ports:
      - "3307:3306"
    volumes:
      - albumix_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    container_name: albumix-redis

volumes:
  albumix_mysql: