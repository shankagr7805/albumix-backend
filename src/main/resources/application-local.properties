# ── Local MySQL (Docker) ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3307/albumix?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ── Local Redis (Docker) ──────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Server ────────────────────────────────────────────────────
server.port=8081

# ── File upload ───────────────────────────────────────────────
file.upload-dir=/tmp/albumix/uploads

# ── Cache logging (shows CACHE HIT / MISS in console) ─────────
logging.level.com.shank.AlbumsAPI.controller=INFO
